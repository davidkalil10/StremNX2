name: Build Switch 1 & Switch 2 NRO

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  build-switch1:
    name: Switch 1 (libnx)
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkita64:20260219

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify or install Switch 1 portlibs
        run: |
          set -euo pipefail
          if [ ! -f /opt/devkitpro/portlibs/switch/lib/libmpv.a ]; then
            dkp-pacman -R --noconfirm switch-tinyxml2 || true
            for attempt in 1 2 3 4; do
              if dkp-pacman -Sy --noconfirm && dkp-pacman -S --needed --noconfirm \
                switch-sdl2 \
                switch-sdl2_ttf \
                switch-sdl2_image \
                switch-curl \
                switch-libmpv \
                switch-pkg-config; then
                break
              fi
              sleep $((attempt * 10))
            done
          fi
          test -f /opt/devkitpro/portlibs/switch/lib/libSDL2.a
          test -f /opt/devkitpro/portlibs/switch/lib/libmpv.a

      - name: Build StremNX for Nintendo Switch 1
        run: |
          make -j"$(nproc)"
          cp -f stremnx.nro stremnx-switch1.nro

      - name: Upload Switch 1 NRO artifact
        uses: actions/upload-artifact@v4
        with:
          name: stremnx-switch1-nro
          path: |
            stremnx-switch1.nro
          if-no-files-found: error

  build-switch2:
    name: Switch 2 (libounce + OunceVK)
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkita64:20260219
    env:
      OUNCE_DEVKIT_TAG: "20261115b"
      OUNCE_DEVKIT_COMMIT: "0f38ba80d7ee768c5749278f127749d14ece2036"

    steps:
      - name: Install host utilities
        run: |
          apt-get update
          apt-get install -y --no-install-recommends python3 git ca-certificates curl xz-utils zstd patch

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache Switch 2 FFmpeg 7.1 build
        uses: actions/cache@v4
        with:
          path: build-switch2/ffmpeg-install
          key: switch2-ffmpeg-7.1-ounce-20261115b-v1

      - name: Run Switch 2 package verifier unit tests
        run: python3 tests/test_switch2_package.py

      - name: Install Switch portlibs and ounce-devkit (Switch 2 SDK)
        run: |
          set -euo pipefail
          sleep 10
          dkp-pacman -R --noconfirm switch-tinyxml2 || true

          sync_ok=0
          for attempt in 1 2 3 4; do
            echo "Synchronizing devkitPro package databases and portlibs (attempt ${attempt}/4)..."
            if dkp-pacman -Sy --noconfirm && dkp-pacman -S --needed --noconfirm \
              switch-sdl2 \
              switch-sdl2_ttf \
              switch-sdl2_image \
              switch-curl \
              switch-libmpv \
              switch-pkg-config; then
              sync_ok=1
              break
            fi
            sleep $((attempt * 15))
          done
          if [ "${sync_ok}" -ne 1 ]; then
            echo "Checking preinstalled Switch portlibs..."
            test -f /opt/devkitpro/portlibs/switch/lib/libSDL2.a
            test -f /opt/devkitpro/portlibs/switch/lib/libmpv.a
            test -f /opt/devkitpro/portlibs/switch/lib/libcurl.a
          fi

          sdk="${RUNNER_TEMP:-/tmp}/ounce-devkit"
          rm -rf "$sdk"
          git init "$sdk"
          git -C "$sdk" fetch --depth=1 https://github.com/ouncebrew/ounce-devkit.git "$OUNCE_DEVKIT_COMMIT"
          git -C "$sdk" checkout --detach FETCH_HEAD
          test "$(git -C "$sdk" rev-parse HEAD)" = "$OUNCE_DEVKIT_COMMIT"
          bash "$sdk/install.sh" "$OUNCE_DEVKIT_TAG"
          test -f /opt/devkitpro/libounce/switch2_rules
          test -f /opt/devkitpro/portlibs/switch2/lib/libEGL.a

      - name: Build and verify StremNX2 for Nintendo Switch 2
        run: |
          chmod +x scripts/build-switch2.sh
          bash scripts/build-switch2.sh
          cp -f stremnx.nro stremnx-switch2.nro

      - name: Upload Switch 2 NRO artifact
        uses: actions/upload-artifact@v4
        with:
          name: stremnx-switch2-nro
          path: |
            stremnx.nro
            stremnx-switch2.nro
            build-switch2/stremnx.map
          if-no-files-found: error

  release:
    name: Publish GitHub Release (Switch 1 + Switch 2)
    needs: [ build-switch1, build-switch2 ]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download Switch 1 NRO
        uses: actions/download-artifact@v4
        with:
          name: stremnx-switch1-nro
          path: release-assets

      - name: Download Switch 2 NRO
        uses: actions/download-artifact@v4
        with:
          name: stremnx-switch2-nro
          path: release-assets

      - name: Publish Release Assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/stremnx-switch2.nro
            release-assets/stremnx-switch1.nro
